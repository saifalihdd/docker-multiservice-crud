version: '3.8'

services:

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PHP_URL:    http://php-service:80
      PYTHON_URL: http://python-service:5000
    depends_on:
      - php-service
      - python-service

  php-service:
    build: ./php-service
    ports:
      - "8080:80"
    environment:
      DB_HOST:     db
      DB_USER:     root
      DB_PASSWORD: alit
      DB_NAME:     p12tugas
    depends_on:
      db:
        condition: service_healthy

  python-service:
    build: ./python-service

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: alit
      MYSQL_DATABASE:      p12tugas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-palit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: